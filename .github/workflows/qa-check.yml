name: QA Portfolio Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify README
        run: test -f README.md

      - name: Verify Excel Files
        run: find . -name "*.xlsx"

      - name: Success
        run: echo "QA Portfolio Validation Passed"
